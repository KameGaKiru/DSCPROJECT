<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Chat — Motorista e Mecânico</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/geral.css">

  <style>
    .chat-container {
      max-width: 850px;
      margin: 35px auto;
    }

    .chat-card {
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
    }

    .mensagens {
      height: 480px;
      padding: 20px;
      overflow-y: auto;
      background-color: #f8faf9;
    }

    .mensagem {
      max-width: 75%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid var(--bs-border-color);
      border-radius: var(--bs-border-radius);
      background-color: #ffffff;
    }

    .mensagem-propria {
      margin-left: auto;
      background-color: #e7f0ed;
    }

    .mensagem-sistema {
      max-width: 100%;
      border: 0;
      background-color: transparent;
      text-align: center;
      color: #6c757d;
      font-size: 0.85rem;
    }

    .mensagem-remetente {
      margin-bottom: 3px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .mensagem-horario {
      margin-top: 4px;
      color: #6c757d;
      font-size: 0.72rem;
    }

    .chat-footer {
      padding: 16px;
      border-top: 1px solid var(--bs-border-color);
      background-color: #ffffff;
    }

    #mensagemGeral {
      margin: 16px 16px 0;
    }
  </style>
</head>

<body>

  <main class="chat-container px-3">

    <section class="card chat-card">

      <header class="topbar chat-header mb-0">

        <div>

          <h1 class="h5 mb-1">
            Chat operacional
          </h1>

          <small id="statusConexao">
            Conectando...
          </small>

        </div>

        <button
          id="voltarBtn"
          type="button"
          class="btn btn-outline-light btn-sm ms-auto">
          Voltar
        </button>

      </header>

      <div
        id="mensagemGeral"
        class="alert"
        role="alert">
      </div>

      <div
        id="mensagens"
        class="mensagens">

        <div class="text-center text-muted">
          Nenhuma mensagem nesta sessão.
        </div>

      </div>

      <footer class="chat-footer">

        <form
          id="chatForm"
          novalidate>

          <div class="d-flex gap-2">

            <input
              type="text"
              id="mensagemInput"
              class="form-control"
              maxlength="500"
              autocomplete="off"
              placeholder="Digite uma mensagem">

            <button
              id="enviarBtn"
              type="submit"
              class="btn btn-primary"
              disabled>
              Enviar
            </button>

          </div>

          <small
            id="mensagemInputErro"
            class="erro-campo">
          </small>

          <div class="text-end mt-1">

            <small class="text-muted">
              <span id="contadorMensagem">0</span>/500
            </small>

          </div>

        </form>

      </footer>

    </section>

  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
  </script>

  <script src="js/mensagens.js"></script>
  <script src="js/chat.js"></script>

</body>
</html>
