<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Dashboard — Mecânico</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/geral.css">
  <link rel="stylesheet" href="css/listar.css">
</head>

<body>

  <header class="topbar">

    <h1>
      Dashboard — Mecânico
    </h1>

    <div class="actions">

      <button
        id="logoutBtn"
        type="button"
        class="btn btn-outline-light btn-sm">
        Sair
      </button>

    </div>

  </header>

  <main class="container pb-5">

    <div
      id="mensagemGeral"
      class="alert"
      role="alert">
    </div>

    <section class="row g-3 mb-4">

      <div class="col-md-4">

        <article class="stat-card">

          <div class="stat-label">
            Total de checklists
          </div>

          <div
            class="stat-value"
            id="totalChecklists">
            —
          </div>

          <div class="stat-sub">
            Checklists registrados no sistema
          </div>

        </article>

      </div>

      <div class="col-md-4">

        <article class="stat-card">

          <div class="stat-label">
            Resolvidos
          </div>

          <div
            class="stat-value"
            id="checklistsResolvidos">
            —
          </div>

          <div class="stat-sub">
            Checklists com solução registrada
          </div>

        </article>

      </div>

      <div class="col-md-4">

        <article class="stat-card">

          <div class="stat-label">
            Pendentes
          </div>

          <div
            class="stat-value"
            id="checklistsPendentes">
            —
          </div>

          <div class="stat-sub">
            Checklists que aguardam atendimento
          </div>

        </article>

      </div>

    </section>

    <section class="card">

      <div class="card-header-bar">
        Checklists registrados
      </div>

      <div class="card-body p-0">

        <div class="table-responsive">

          <table class="table table-hover mb-0">

            <thead class="table-light">

              <tr>
                <th>Tipo</th>
                <th>Veículo</th>
                <th>Motorista</th>
                <th>KM</th>
                <th>Itens / Observação</th>
                <th>Solução</th>
                <th>Ações</th>
              </tr>

            </thead>

            <tbody id="checklistTable">

              <tr>

                <td
                  colspan="7"
                  class="text-center text-muted py-4">
                  Carregando...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>

  <div
    class="modal fade"
    id="modalSolucao"
    tabindex="-1"
    aria-labelledby="modalSolucaoLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h2
            class="modal-title h5"
            id="modalSolucaoLabel">
            Confirmar solução
          </h2>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Fechar">
          </button>

        </div>

        <div class="modal-body">

          <form
            id="formSolucao"
            novalidate>

            <input
              type="hidden"
              id="checklistIdSolucao">

            <div class="mb-3">

              <label
                for="solucaoMecanico"
                class="form-label">
                Descrição da solução
              </label>

              <textarea
                id="solucaoMecanico"
                class="form-control"
                rows="4"
                maxlength="400"
                placeholder="Descreva o que foi verificado e resolvido">
              </textarea>

              <small
                id="solucaoMecanicoErro"
                class="erro-campo">
              </small>

              <div class="text-end mt-1">

                <small class="text-muted">
                  <span id="contadorSolucao">0</span>/400
                </small>

              </div>

            </div>

            <div class="d-flex gap-2 justify-content-end">

              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal">
                Cancelar
              </button>

              <button
                type="submit"
                class="btn btn-success px-4">
                Confirmar solução
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <script src="js/mensagens.js"></script>
  <script src="js/mecanicos.js"></script>

</body>
</html>
