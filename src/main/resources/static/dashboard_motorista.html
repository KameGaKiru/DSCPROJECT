<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Motorista</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/geral.css">
  <link rel="stylesheet" href="css/listar.css">
</head>

<body>

  <header class="topbar">

    <span
      class="topbar-icon"
      aria-hidden="true">
    </span>

    <div>
      <h1>
        Motorista
      </h1>

      <div
        id="nomeMotorista"
        class="motorista-identificacao">
        Carregando usuário...
      </div>
    </div>

    <div class="actions">

      <button
        id="chatBtn"
        type="button"
        class="btn btn-outline-light btn-sm">
        Chat
      </button>

      <button
        id="checklistBtn"
        type="button"
        class="btn btn-light btn-sm">
        Fazer checklist
      </button>

      <button
        id="logoutBtn"
        type="button"
        class="btn btn-outline-light btn-sm">
        Sair
      </button>

    </div>

  </header>

  <main class="container pb-5">

    <div
      id="mensagemGeral"
      class="alert"
      role="alert"
      aria-live="polite">
    </div>

    <section class="row g-3 mb-4">

      <div class="col-md-6">

        <article class="stat-card">

          <div
            class="stat-icon"
            aria-hidden="true">
            📋
          </div>

          <div>

            <div class="stat-label">
              Meus checklists
            </div>

            <div
              id="totalChecklists"
              class="stat-value">
              —
            </div>

            <div class="stat-sub">
              Registros feitos por você
            </div>

          </div>

        </article>

      </div>

      <div class="col-md-6">

        <article
          id="rankingCard"
          class="stat-card">

          <div
            class="stat-icon"
            aria-hidden="true">
            🏆
          </div>

          <div>

            <div class="stat-label">
              Sua posição no ranking
            </div>

            <div
              id="rankingPosicao"
              class="stat-value">
              —
            </div>

            <div
              id="rankingSub"
              class="stat-sub">
              Comparado aos demais motoristas
            </div>

          </div>

        </article>

      </div>

    </section>

    <section class="card">

      <div class="card-header-bar">
        Lista de funcionários
      </div>

      <div class="card-body p-0">

        <div class="table-responsive">

          <table
            id="usuariosTable"
            class="table table-hover mb-0">

            <thead class="table-light">

              <tr>
                <th>Matrícula</th>
                <th>Nome</th>
                <th>Função</th>
                <th>E-mail</th>
                <th>Checklists</th>
              </tr>

            </thead>

            <tbody>

              <tr>
                <td
                  colspan="5"
                  class="text-center text-muted py-4">
                  Carregando funcionários...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>

  <script src="js/mensagens.js"></script>
  <script src="js/motorista.js"></script>

</body>
</html>
