<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Sistema de Registro — Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/geral.css">

</head>

<body>

  <main
    class="container d-flex align-items-center justify-content-center min-vh-100 py-4">

    <section
      class="card w-100"
      style="max-width: 420px;">

      <div class="card-body p-4 p-md-5">

        <header class="text-center mb-4">

          <h1 class="h3 mb-2">
            Acesso ao sistema
          </h1>

          <p class="text-muted mb-0">
            Informe sua matrícula e senha para continuar.
          </p>

        </header>

        <div
          id="mensagemGeral"
          class="alert"
          role="alert">
        </div>

        <form
          id="loginForm"
          novalidate>

          <div class="mb-3">

            <label
              for="matricula"
              class="form-label">
              Matrícula
            </label>

            <input
              type="text"
              id="matricula"
              class="form-control"
              inputmode="numeric"
              maxlength="12"
              autocomplete="username"
              placeholder="Digite sua matrícula">

            <small
              id="matriculaErro"
              class="erro-campo">
            </small>

          </div>

          <div class="mb-4">

            <label
              for="senha"
              class="form-label">
              Senha
            </label>

            <input
              type="password"
              id="senha"
              class="form-control"
              minlength="6"
              maxlength="20"
              autocomplete="current-password"
              placeholder="Digite sua senha">

            <small
              id="senhaErro"
              class="erro-campo">
            </small>

          </div>

          <button
            type="submit"
            class="btn btn-primary w-100">
            Entrar
          </button>

        </form>

        <footer class="text-center mt-4">

          <p class="text-muted small mb-1">
            Ainda não possui uma conta?
          </p>

          <a
            href="registro.html"
            class="text-decoration-none">
            Criar conta
          </a>

        </footer>

      </div>

    </section>

  </main>

  <script src="js/mensagens.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
