<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Registro de Usuário</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/geral.css">
  
</head>

<body>

  <main
    class="container py-4 py-md-5"
    style="max-width: 560px;">

    <section class="card">

      <div class="card-body p-4 p-md-5">

        <header class="mb-4">

          <h1 class="h4 mb-2">
            Criar conta
          </h1>

          <p class="text-muted mb-0">
            Preencha os dados abaixo para registrar um novo usuário.
          </p>

        </header>

        <div
          id="mensagemGeral"
          class="alert"
          role="alert">
        </div>

        <form
          id="registroForm"
          novalidate>

          <div class="mb-3">

            <label
              for="matricula"
              class="form-label">
              Matrícula
            </label>

            <input
              type="text"
              id="matricula"
              class="form-control"
              inputmode="numeric"
              maxlength="12"
              autocomplete="username"
              placeholder="Somente números, máximo de 12 dígitos">

            <small
              id="matriculaErro"
              class="erro-campo">
            </small>

          </div>

          <div class="mb-3">

            <label
              for="nome"
              class="form-label">
              Nome
            </label>

            <input
              type="text"
              id="nome"
              class="form-control"
              maxlength="60"
              autocomplete="given-name"
              placeholder="Digite o nome">

            <small
              id="nomeErro"
              class="erro-campo">
            </small>

          </div>

          <div class="mb-3">

            <label
              for="sobrenome"
              class="form-label">
              Sobrenome
            </label>

            <input
              type="text"
              id="sobrenome"
              class="form-control"
              maxlength="60"
              autocomplete="family-name"
              placeholder="Digite o sobrenome">

            <small
              id="sobrenomeErro"
              class="erro-campo">
            </small>

          </div>

          <div class="mb-3">

            <label
              for="funcao"
              class="form-label">
              Função
            </label>

            <select
              id="funcao"
              class="form-select">

              <option value="">
                Selecione uma função
              </option>

              <option value="MOTORISTA">
                Motorista
              </option>

              <option value="COORDENADOR">
                Coordenador
              </option>

              <option value="MECANICO">
                Mecânico
              </option>

            </select>

            <small
              id="funcaoErro"
              class="erro-campo">
            </small>

          </div>

          <div class="mb-4">

            <label
              for="senha"
              class="form-label">
              Senha
            </label>

            <input
              type="password"
              id="senha"
              class="form-control"
              minlength="6"
              maxlength="20"
              autocomplete="new-password"
              placeholder="Entre 6 e 20 caracteres">

            <small
              id="senhaErro"
              class="erro-campo">
            </small>

          </div>

          <div class="d-grid gap-2 d-sm-flex">

            <button
              type="submit"
              class="btn btn-primary px-4">
              Registrar
            </button>

            <a
              href="index.html"
              class="btn btn-outline-secondary">
              Voltar
            </a>

          </div>

        </form>

      </div>

    </section>

  </main>

  <script src="js/mensagens.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
